[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phonrec"
version = "0.1.0"
description = "Phoneme recognition with XLS-R-300M + CTC (ARPAbet + accent-marked phonemes)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
